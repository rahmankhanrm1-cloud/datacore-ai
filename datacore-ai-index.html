<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050816" />
  <title>DataCore AI</title>
  <meta name="description" content="DataCore AI - AI Chat, CV, Excel, Documents and Coding Assistant." />
  <style>
    :root{
      --bg:#050816;
      --panel:#0b1024;
      --panel2:#11182f;
      --text:#eef3ff;
      --muted:#9ba8c7;
      --line:rgba(255,255,255,.10);
      --accent:#6ea8fe;
      --accent2:#7c5cff;
      --ok:#35d39a;
      --shadow:0 20px 60px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:
      radial-gradient(circle at 15% 10%, rgba(74,117,255,.14), transparent 30%),
      radial-gradient(circle at 85% 20%, rgba(124,92,255,.12), transparent 28%),
      var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    body{display:flex;min-height:100vh}
    .app{width:min(1100px,100%);margin:auto;min-height:100vh;display:grid;grid-template-columns:280px 1fr}
    .sidebar{border-right:1px solid var(--line);padding:20px;background:rgba(5,8,22,.74);backdrop-filter:blur(18px);position:sticky;top:0;height:100vh}
    .brand{display:flex;gap:12px;align-items:center;margin-bottom:22px}
    .logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;box-shadow:0 10px 30px rgba(110,168,254,.25)}
    .brand h1{font-size:18px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:3px 0 0}
    .tools{display:grid;gap:8px}
    .tool{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);padding:12px 13px;border-radius:13px;text-align:left;cursor:pointer;font-size:14px}
    .tool:hover,.tool.active{background:linear-gradient(135deg,rgba(110,168,254,.16),rgba(124,92,255,.14));border-color:rgba(110,168,254,.35)}
    .small{font-size:12px;color:var(--muted);line-height:1.5}
    .side-bottom{position:absolute;left:20px;right:20px;bottom:18px}
    .clear{width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
    .main{display:flex;flex-direction:column;min-height:100vh}
    .topbar{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:rgba(5,8,22,.55);backdrop-filter:blur(16px);position:sticky;top:0;z-index:5}
    .status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 15px var(--ok)}
    .mode{font-weight:700}
    .chat{flex:1;padding:26px 22px 150px;overflow:auto}
    .welcome{max-width:720px;margin:7vh auto 0;text-align:center}
    .welcome h2{font-size:clamp(30px,6vw,52px);margin:0 0 12px;line-height:1.04}
    .welcome h2 span{background:linear-gradient(90deg,var(--accent),#a88cff);-webkit-background-clip:text;background-clip:text;color:transparent}
    .welcome p{color:var(--muted);font-size:16px;line-height:1.65;margin:auto;max-width:650px}
    .chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:24px}
    .chip{padding:10px 13px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.03);color:var(--text);cursor:pointer}
    .messages{max-width:820px;margin:0 auto;display:grid;gap:16px}
    .msg{display:flex;gap:11px;align-items:flex-start}
    .msg.user{justify-content:flex-end}
    .bubble{max-width:min(78%,720px);padding:13px 15px;border-radius:18px;line-height:1.55;white-space:pre-wrap;word-break:break-word;border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.12)}
    .user .bubble{background:linear-gradient(135deg,rgba(110,168,254,.20),rgba(124,92,255,.18));border-bottom-right-radius:6px}
    .assistant .bubble{background:rgba(255,255,255,.04);border-bottom-left-radius:6px}
    .avatar{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));flex:0 0 auto}
    .composer-wrap{position:fixed;bottom:0;left:calc((100vw - min(1100px,100vw))/2 + 280px);right:calc((100vw - min(1100px,100vw))/2);padding:14px 22px 18px;background:linear-gradient(to top,var(--bg) 68%,transparent)}
    .composer{max-width:820px;margin:auto;border:1px solid rgba(255,255,255,.14);background:rgba(11,16,36,.92);border-radius:18px;box-shadow:var(--shadow);padding:10px;display:flex;gap:8px;align-items:flex-end;backdrop-filter:blur(20px)}
    textarea{flex:1;background:transparent;border:0;outline:0;color:var(--text);resize:none;min-height:44px;max-height:160px;padding:11px 10px;font:inherit}
    .send{width:46px;height:46px;border-radius:14px;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:20px;cursor:pointer}
    .send:disabled{opacity:.5;cursor:not-allowed}
    .hint{max-width:820px;margin:7px auto 0;color:var(--muted);font-size:11px;text-align:center}
    .typing{display:inline-flex;gap:4px}.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bounce 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
    @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
    .menuBtn{display:none;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:10px;padding:8px 10px}
    @media(max-width:800px){
      .app{display:block}.sidebar{position:fixed;z-index:20;left:-310px;top:0;width:280px;transition:.25s}.sidebar.open{left:0}
      .menuBtn{display:inline-block}.composer-wrap{left:0;right:0;padding-left:12px;padding-right:12px}.topbar{padding:14px}.chat{padding-left:14px;padding-right:14px}
      .bubble{max-width:88%}
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo">D</div>
        <div><h1>DataCore AI</h1><p>All-in-one AI workspace</p></div>
      </div>
      <div class="tools">
        <button class="tool active" data-mode="chat">💬 AI Chat</button>
        <button class="tool" data-mode="cv">📄 CV / Resume AI</button>
        <button class="tool" data-mode="job">✉️ Job Assistant</button>
        <button class="tool" data-mode="excel">📊 Excel AI</button>
        <button class="tool" data-mode="document">📁 Document AI</button>
        <button class="tool" data-mode="dc">🗂️ Document Control AI</button>
        <button class="tool" data-mode="code">💻 Code AI</button>
        <button class="tool" data-mode="website">🌐 Website AI</button>
      </div>
      <div class="side-bottom">
        <div class="small" style="margin-bottom:10px">Version 1 • Powered by DataCore AI</div>
        <button class="clear" id="clearBtn">Clear chat</button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:10px">
          <button class="menuBtn" id="menuBtn">☰</button>
          <div class="mode" id="modeTitle">AI Chat</div>
        </div>
        <div class="status"><span class="dot"></span> AI Online</div>
      </div>

      <section class="chat" id="chat">
        <div class="welcome" id="welcome">
          <h2>Welcome to <span>DataCore AI</span></h2>
          <p>Your AI assistant for everyday questions, CVs, job applications, Excel, documents, document control, coding and websites.</p>
          <div class="chips">
            <button class="chip">Create a professional CV</button>
            <button class="chip">Help me with Excel</button>
            <button class="chip">Write a job application email</button>
            <button class="chip">Build a simple website</button>
          </div>
        </div>
        <div class="messages" id="messages"></div>
      </section>

      <div class="composer-wrap">
        <div class="composer">
          <textarea id="input" rows="1" placeholder="Message DataCore AI..."></textarea>
          <button class="send" id="sendBtn">➤</button>
        </div>
        <div class="hint">AI can make mistakes. Check important information.</div>
      </div>
    </main>
  </div>

  <script>
    const API_URL = "https://datacore-ai-api.datacore-solutionswork.workers.dev/";

    const modePrompts = {
      chat: "You are in GENERAL AI CHAT mode. Answer clearly and helpfully.",
      cv: "You are in CV/RESUME mode. Help create, improve, rewrite and tailor ATS-friendly resumes for any job category. Never invent experience or qualifications.",
      job: "You are in JOB ASSISTANT mode. Help with cover letters, application emails, interview preparation and job-related writing.",
      excel: "You are in EXCEL mode. Help with Excel formulas, data cleaning, spreadsheet structure, CSV logic and step-by-step spreadsheet tasks.",
      document: "You are in DOCUMENT AI mode. Help summarize, explain, rewrite and organize document content. Ask for pasted text when file content is not available.",
      dc: "You are in DOCUMENT CONTROL mode. Help with registers, transmittals, revision tracking, WIR, ITP, correspondence logs and document workflows.",
      code: "You are in CODE mode. Help write, explain and debug code. Prefer complete runnable examples when practical.",
      website: "You are in WEBSITE BUILDER mode. Help plan and generate HTML, CSS and JavaScript websites and explain deployment steps."
    };

    const modeNames = {
      chat:"AI Chat", cv:"CV / Resume AI", job:"Job Assistant", excel:"Excel AI",
      document:"Document AI", dc:"Document Control AI", code:"Code AI", website:"Website AI"
    };

    let mode = localStorage.getItem("datacore_mode") || "chat";
    let history = JSON.parse(localStorage.getItem("datacore_chat") || "[]");

    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const modeTitle = document.getElementById("modeTitle");
    const sidebar = document.getElementById("sidebar");

    function save(){
      localStorage.setItem("datacore_chat", JSON.stringify(history));
      localStorage.setItem("datacore_mode", mode);
    }

    function render(){
      messages.innerHTML = "";
      welcome.style.display = history.length ? "none" : "block";
      history.forEach(item => addMessage(item.role, item.text, false));
      modeTitle.textContent = modeNames[mode];
      document.querySelectorAll(".tool").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
    }

    function addMessage(role, text, scroll=true){
      const row = document.createElement("div");
      row.className = "msg " + role;
      if(role === "assistant"){
        const av = document.createElement("div"); av.className="avatar"; av.textContent="AI"; row.appendChild(av);
      }
      const bubble = document.createElement("div"); bubble.className="bubble"; bubble.textContent=text; row.appendChild(bubble);
      messages.appendChild(row);
      if(scroll) row.scrollIntoView({behavior:"smooth", block:"end"});
      return bubble;
    }

    function typingBubble(){
      const row = document.createElement("div"); row.className="msg assistant";
      const av = document.createElement("div"); av.className="avatar"; av.textContent="AI"; row.appendChild(av);
      const b = document.createElement("div"); b.className="bubble"; b.innerHTML='<span class="typing"><span></span><span></span><span></span></span>'; row.appendChild(b);
      messages.appendChild(row); row.scrollIntoView({behavior:"smooth", block:"end"}); return row;
    }

    async function sendMessage(text){
      text = (text || input.value).trim();
      if(!text) return;
      history.push({role:"user", text}); save(); render();
      input.value=""; autoGrow(); sendBtn.disabled=true;
      const typing = typingBubble();

      try{
        const prompt = modePrompts[mode] + "\n\nUser request:\n" + text;
        const res = await fetch(API_URL, {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({prompt})
        });
        const data = await res.json();
        typing.remove();
        const answer = data.response || data.error || "Sorry, I could not get a response.";
        history.push({role:"assistant", text:answer}); save(); render();
        window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"});
      }catch(err){
        typing.remove();
        history.push({role:"assistant", text:"Connection error. Please check your internet connection and try again."}); save(); render();
      }finally{
        sendBtn.disabled=false; input.focus();
      }
    }

    function autoGrow(){
      input.style.height="auto";
      input.style.height=Math.min(input.scrollHeight,160)+"px";
    }

    sendBtn.addEventListener("click",()=>sendMessage());
    input.addEventListener("input",autoGrow);
    input.addEventListener("keydown",e=>{
      if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendMessage(); }
    });

    document.querySelectorAll(".tool").forEach(btn=>{
      btn.addEventListener("click",()=>{
        mode=btn.dataset.mode; save(); render(); sidebar.classList.remove("open");
        input.placeholder="Message " + modeNames[mode] + "...";
      });
    });

    document.querySelectorAll(".chip").forEach(chip=>{
      chip.addEventListener("click",()=>sendMessage(chip.textContent));
    });

    document.getElementById("clearBtn").addEventListener("click",()=>{
      history=[]; save(); render();
    });

    document.getElementById("menuBtn").addEventListener("click",()=>sidebar.classList.toggle("open"));
    document.addEventListener("click",e=>{
      if(window.innerWidth<=800 && sidebar.classList.contains("open") && !sidebar.contains(e.target) && e.target.id!=="menuBtn"){
        sidebar.classList.remove("open");
      }
    });

    render();
    input.placeholder="Message " + modeNames[mode] + "...";
  </script>
</body>
</html>
