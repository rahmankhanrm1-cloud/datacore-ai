name: Test NibrasGPT Worker

on:
  push:
    branches: [main, feature/notion-integration-plan-20261018]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check module and Worker syntax
        run: |
          node --check worker.js
          node --check notion-read.js
          node --check workspace.js
          node --check media.js
          node --check workspace-ui.js
          node --check sw.js
      - name: Run Worker and integration tests
        run: node --test tests/*.test.mjs
