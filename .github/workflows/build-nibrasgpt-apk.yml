name: Build NibrasGPT Android test APK

on:
  push:
    branches:
      - feature/unified-prompt-router-20261120
    paths:
      - 'android/**'
      - '.github/workflows/build-nibrasgpt-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android debug APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Prepare APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/NibrasGPT-Android-native-google-test.apk
          sha256sum output/NibrasGPT-Android-native-google-test.apk
          echo "Debug certificate SHA1 for Google OAuth Android app registration:"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:"
      - uses: actions/upload-artifact@v4
        with:
          name: NibrasGPT-Android-native-google-test-APK
          path: output/NibrasGPT-Android-native-google-test.apk
          if-no-files-found: error
          retention-days: 30
